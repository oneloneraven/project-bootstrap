      - name: Create and migrate the Preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_NAME="{{slug}}-pr-$PR_NUMBER"
          database_id() {
            pnpm exec wrangler d1 list --json | sed -n '/^\[/,$p' | jq -r --arg name "$DB_NAME" '.[] | select(.name == $name) | .uuid'
          }
          DB_ID=$(database_id)
          if [ -z "$DB_ID" ]; then
            pnpm exec wrangler d1 create "$DB_NAME" --location weur
            DB_ID=$(database_id)
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::Couldn't find the D1 database $DB_NAME."
            exit 1
          fi
          export DB_NAME DB_ID
          node --input-type=module - <<'JS'
          import { writeFileSync } from "node:fs";
          import { experimental_readRawConfig as readRawConfig } from "wrangler";
          const { rawConfig } = readRawConfig({ config: "wrangler.jsonc" });
          const preview = rawConfig.env?.preview;
          for (const [where, databases] of [["env.preview", preview?.d1_databases], ["env.preview.previews", preview?.previews?.d1_databases]]) {
            const binding = databases?.find(db => db.binding === "DB");
            if (!binding) {
              console.error(`::error::${where}.d1_databases in wrangler.jsonc has no DB binding.`);
              process.exit(1);
            }
            binding.database_name = process.env.DB_NAME;
            binding.database_id = process.env.DB_ID;
          }
          writeFileSync(".wrangler-preview.jsonc", JSON.stringify(rawConfig, null, 2));
          JS
          pnpm exec wrangler d1 migrations apply "$DB_NAME" -c .wrangler-preview.jsonc --env preview --remote
