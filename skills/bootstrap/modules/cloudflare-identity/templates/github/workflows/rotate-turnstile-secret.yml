name: Rotate a Turnstile widget secret

on:
  workflow_dispatch:
    inputs:
      sitekey:
        description: "The sitekey of the widget whose secret to rotate"
        required: true
        type: string
      invalidate_immediately:
        description: "Stop the old secret working now instead of after Cloudflare's grace period"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rotate-turnstile-secret
  cancel-in-progress: false

jobs:
  rotate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: infra
    steps:
      - name: Rotate the secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_APPLY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SITEKEY: ${{ inputs.sitekey }}
          INVALIDATE: ${{ inputs.invalidate_immediately }}
        run: |
          set -euo pipefail
          if ! [[ "$SITEKEY" =~ ^0x[0-9A-Za-z_-]{6,40}$ ]]; then
            echo "::error::The sitekey isn't in the expected format."
            exit 1
          fi
          body=$(jq -cn --argjson invalidate "$INVALIDATE" '{invalidate_immediately: $invalidate}')
          if ! curl -sSf -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets/${SITEKEY}/rotate_secret" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$body" | jq -e '.success == true' > /dev/null; then
            echo "::error::Cloudflare didn't confirm the rotation."
            exit 1
          fi
          echo "Rotated. Read the new secret on the widget's Turnstile page in the Cloudflare dashboard."
